<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Проверка голоса — intime</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f7f8fa;
      --ink: #303139;
      --muted: #686d7b;
      --line: #e8e8ef;
      --accent: #6258c8;
      --on-accent: #ffffff;
      --danger: #b94655;
      --user: #efedfb;
      --font: "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font: 15px/1.45 var(--font);
      color: var(--ink);
      background: var(--bg);
    }
    .page {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 720px;
      margin: 0 auto;
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.3px; }
    header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    header a { color: var(--accent); white-space: nowrap; }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .empty { margin: auto; color: var(--muted); text-align: center; max-width: 28em; }
    .msg { max-width: 90%; padding: 10px 14px; border-radius: 14px; }
    .msg--user { align-self: flex-end; background: var(--user); }
    .msg--note { align-self: flex-start; color: var(--danger); background: #fcf0f1; }
    .msg time { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
    .settled { color: var(--muted); }
    .fresh { color: var(--accent); }
    .caret {
      display: inline-block;
      width: 2px;
      height: 1em;
      margin-left: 2px;
      background: var(--accent);
      vertical-align: text-bottom;
      animation: blink 1s steps(1) infinite;
    }
    .msg.is-done .settled { color: inherit; }
    .msg.is-done .caret { display: none; }
    @keyframes blink { 50% { opacity: 0; } }
    form {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 20px 18px;
      border-top: 1px solid var(--line);
    }
    #status { flex: 1; min-height: 1.4em; color: var(--muted); font-size: 13px; }
    button, .file {
      min-height: 44px;
      border: 0;
      border-radius: 12px;
      font: inherit;
      cursor: pointer;
    }
    #mic {
      min-width: 148px;
      padding: 0 16px;
      color: var(--on-accent);
      background: var(--accent);
    }
    #mic[aria-pressed="true"] { background: var(--danger); }
    #mic:disabled { opacity: 0.55; cursor: default; }
    .file {
      display: inline-flex;
      align-items: center;
      padding: 0 14px;
      color: var(--ink);
      background: var(--surface);
      box-shadow: inset 0 0 0 1px var(--line);
    }
    .file input { display: none; }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <h1>Проверка голоса</h1>
        <p>Одна фраза на всю запись. Серым — уже сказанное, цветом — то, что только что дописали.</p>
      </div>
      <a href="/">К приложению</a>
    </header>
    <div id="log" aria-live="polite">
      <p class="empty" id="empty">Нажмите «Говорить» и читайте сколько нужно. На паузе текст дописывается в то же сообщение. «Стоп» заканчивает фразу.</p>
    </div>
    <form id="bar">
      <p id="status" role="status"></p>
      <label class="file">Файл<input id="file" type="file" accept="audio/*,.wav,.webm,.ogg,.mp3,.m4a"></label>
      <button id="mic" type="button" aria-pressed="false">Говорить</button>
    </form>
  </div>
  <script>
    const log = document.getElementById("log");
    const empty = document.getElementById("empty");
    const status = document.getElementById("status");
    const mic = document.getElementById("mic");
    const fileInput = document.getElementById("file");

    const TARGET_RATE = 16000;
    const SPEECH_RMS = 0.02;
    const QUIET_MS = 1000;
    const MIN_FLUSH_MS = 500;
    const MAX_CHUNK_MS = 20000;

    let recording = false;
    let stopping = false;
    let busy = false;
    let context = null;
    let stream = null;
    let processor = null;
    let mute = null;
    let source = null;
    let sampleRate = 48000;
    let buffers = [];
    let samples = 0;
    let quietSamples = 0;
    let heard = false;
    let chain = Promise.resolve();
    let pending = 0;
    let bubble = null;
    let settledNode = null;
    let freshNode = null;
    let caretNode = null;
    let timeNode = null;
    let settledText = "";
    let freshText = "";
    let recognizedMs = 0;
    let sessionStarted = 0;

    function setStatus(text) {
      status.textContent = text;
    }

    function addMessage(text, kind, meta) {
      if (empty) empty.remove();
      const item = document.createElement("div");
      item.className = "msg msg--" + kind;
      item.textContent = text;
      if (meta) {
        const time = document.createElement("time");
        time.textContent = meta;
        item.appendChild(time);
      }
      log.appendChild(item);
      log.scrollTop = log.scrollHeight;
    }

    function rms(samples) {
      let sum = 0;
      for (let i = 0; i < samples.length; i += 1) sum += samples[i] * samples[i];
      return Math.sqrt(sum / samples.length);
    }

    function encodeWav(samples, rate) {
      const bytes = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(bytes);
      const write = (offset, text) => {
        for (let i = 0; i < text.length; i += 1) view.setUint8(offset + i, text.charCodeAt(i));
      };
      write(0, "RIFF");
      view.setUint32(4, 36 + samples.length * 2, true);
      write(8, "WAVE");
      write(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, rate, true);
      view.setUint32(28, rate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      write(36, "data");
      view.setUint32(40, samples.length * 2, true);
      let offset = 44;
      for (let i = 0; i < samples.length; i += 1) {
        const sample = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
        offset += 2;
      }
      return new Blob([bytes], { type: "audio/wav" });
    }

    function resample(buffers, rate) {
      let length = 0;
      for (let i = 0; i < buffers.length; i += 1) length += buffers[i].length;
      const merged = new Float32Array(length);
      let offset = 0;
      for (let i = 0; i < buffers.length; i += 1) {
        merged.set(buffers[i], offset);
        offset += buffers[i].length;
      }
      const outLength = Math.max(1, Math.round((merged.length * TARGET_RATE) / rate));
      const pcm = new Float32Array(outLength);
      const ratio = rate / TARGET_RATE;
      for (let i = 0; i < outLength; i += 1) {
        const src = i * ratio;
        const left = Math.floor(src);
        const frac = src - left;
        const a = merged[left] || 0;
        const b = merged[Math.min(left + 1, merged.length - 1)] || a;
        pcm[i] = a + (b - a) * frac;
      }
      return pcm;
    }

    function joinText(left, right) {
      const previous = String(left || "").trim();
      let next = String(right || "").trim();
      if (!previous) return next;
      if (!next) return previous;
      if (!/[.!?…]["»)]?$/.test(previous) && !previous.endsWith("...")) {
        next = next.replace(/^(\p{Lu})/u, (letter) => letter.toLocaleLowerCase("ru-RU"));
      }
      return previous + " " + next;
    }

    function releaseGraph() {
      if (processor) {
        processor.onaudioprocess = null;
        processor.disconnect();
      }
      if (source) source.disconnect();
      if (mute) mute.disconnect();
      if (stream) stream.getTracks().forEach((track) => track.stop());
      processor = null;
      source = null;
      mute = null;
      stream = null;
    }

    function resetCapture() {
      buffers = [];
      samples = 0;
      quietSamples = 0;
      heard = false;
    }

    function ensureBubble() {
      if (bubble) return;
      if (empty) empty.remove();
      bubble = document.createElement("div");
      bubble.className = "msg msg--user msg--live";
      settledNode = document.createElement("span");
      settledNode.className = "settled";
      freshNode = document.createElement("span");
      freshNode.className = "fresh";
      caretNode = document.createElement("span");
      caretNode.className = "caret";
      caretNode.setAttribute("aria-hidden", "true");
      timeNode = document.createElement("time");
      bubble.append(settledNode, freshNode, caretNode, timeNode);
      log.appendChild(bubble);
    }

    function renderBubble() {
      if (!bubble) return;
      settledNode.textContent = settledText;
      freshNode.textContent = freshText ? (settledText ? " " : "") + freshText : "";
      caretNode.hidden = !recording && pending === 0;
      if (recording || pending > 0) timeNode.textContent = pending > 0 ? "дописываю" : "слушаю";
      log.scrollTop = log.scrollHeight;
    }

    function acceptText(text) {
      if (freshText) settledText = joinText(settledText, freshText);
      freshText = text;
      renderBubble();
    }

    function finishBubble() {
      if (freshText) settledText = joinText(settledText, freshText);
      freshText = "";
      if (!bubble) return;
      if (!settledText) {
        bubble.remove();
        bubble = null;
        return;
      }
      bubble.classList.add("is-done");
      bubble.classList.remove("msg--live");
      const seconds = ((performance.now() - sessionStarted) / 1000).toFixed(1);
      settledNode.textContent = settledText;
      freshNode.textContent = "";
      caretNode.hidden = true;
      timeNode.textContent = seconds + " с записи, " + recognizedMs + " мс распознавания";
      bubble = null;
    }

    async function recognize(blob) {
      const started = performance.now();
      let response;
      try {
        const body = new FormData();
        body.append("file", blob, "speech.wav");
        body.append("model", "gigaam");
        response = await fetch("/stt/v1/audio/transcriptions", { method: "POST", body });
      } catch (error) {
        addMessage("Не удалось отправить запись.", "note");
        return;
      }
      recognizedMs += Math.round(performance.now() - started);
      if (!response.ok) {
        let detail = "Сервис распознавания ответил " + response.status;
        try {
          const payload = await response.json();
          if (payload.error && payload.error.message) detail = payload.error.message;
        } catch (error) { /* тело не JSON */ }
        addMessage(detail, "note");
        return;
      }
      let text = "";
      try {
        const payload = await response.json();
        text = payload && payload.text ? String(payload.text).trim() : "";
      } catch (error) {
        addMessage("Сервис распознавания вернул непонятный ответ.", "note");
        return;
      }
      if (text) acceptText(text);
    }

    function enqueue(blob) {
      ensureBubble();
      pending += 1;
      renderBubble();
      setStatus("Дописываю…");
      chain = chain
        .catch(() => {})
        .then(() => recognize(blob))
        .finally(() => {
          pending -= 1;
          renderBubble();
          if (recording && pending === 0) setStatus("Слушаю…");
        });
    }

    function flush() {
      const totalMs = (samples / sampleRate) * 1000;
      if (!heard || totalMs < MIN_FLUSH_MS) return;
      const taken = buffers;
      resetCapture();
      enqueue(encodeWav(resample(taken, sampleRate), TARGET_RATE));
    }

    function onSamples(input) {
      const copy = new Float32Array(input);
      buffers.push(copy);
      samples += copy.length;
      if (rms(copy) >= SPEECH_RMS) {
        heard = true;
        quietSamples = 0;
      } else if (heard) quietSamples += copy.length;
      const totalMs = (samples / sampleRate) * 1000;
      const quietMs = (quietSamples / sampleRate) * 1000;
      if (heard && quietMs >= QUIET_MS && totalMs >= MIN_FLUSH_MS) flush();
      else if (totalMs >= MAX_CHUNK_MS) flush();
    }

    async function transcribeFile(blob, filename) {
      busy = true;
      mic.disabled = true;
      setStatus("Распознаю…");
      const started = performance.now();
      try {
        const body = new FormData();
        body.append("file", blob, filename);
        body.append("model", "gigaam");
        const response = await fetch("/stt/v1/audio/transcriptions", { method: "POST", body });
        const elapsed = Math.round(performance.now() - started);
        if (!response.ok) {
          addMessage("Сервис распознавания ответил " + response.status, "note");
          setStatus("");
          return;
        }
        const payload = await response.json();
        const text = payload && payload.text ? String(payload.text).trim() : "";
        if (!text) {
          addMessage("Пустой текст.", "note");
          setStatus("");
          return;
        }
        addMessage(text, "user", elapsed + " мс распознавания");
        setStatus("");
      } catch (error) {
        addMessage("Не удалось отправить запись.", "note");
        setStatus("");
      } finally {
        busy = false;
        mic.disabled = false;
      }
    }

    async function start() {
      if (recording || stopping || busy) return;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        addMessage("В этом браузере нет доступа к микрофону.", "note");
        return;
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: { ideal: 1 }, echoCancellation: true, noiseSuppression: true },
        });
      } catch (error) {
        const name = error && error.name ? error.name : "";
        addMessage(name === "NotAllowedError" ? "Браузер не дал доступ к микрофону." : "Микрофон не открылся.", "note");
        stream = null;
        return;
      }
      context = context || new AudioContext();
      if (context.state === "suspended") await context.resume();
      sampleRate = context.sampleRate || 48000;
      resetCapture();
      chain = Promise.resolve();
      pending = 0;
      bubble = null;
      settledText = "";
      freshText = "";
      recognizedMs = 0;
      sessionStarted = performance.now();
      source = context.createMediaStreamSource(stream);
      processor = context.createScriptProcessor(4096, 1, 1);
      mute = context.createGain();
      mute.gain.value = 0;
      processor.onaudioprocess = (event) => {
        if (!recording) return;
        onSamples(event.inputBuffer.getChannelData(0));
      };
      source.connect(processor);
      processor.connect(mute);
      mute.connect(context.destination);
      recording = true;
      ensureBubble();
      renderBubble();
      mic.textContent = "Стоп";
      mic.setAttribute("aria-pressed", "true");
      setStatus("Слушаю…");
    }

    async function stop() {
      if (!recording || stopping) return;
      stopping = true;
      recording = false;
      mic.disabled = true;
      mic.textContent = "Говорить";
      mic.setAttribute("aria-pressed", "false");
      flush();
      releaseGraph();
      setStatus(pending > 0 ? "Дописываю…" : "");
      try {
        await chain;
      } finally {
        finishBubble();
        stopping = false;
        mic.disabled = false;
        if (!settledText) setStatus("Не расслышала. Скажите ещё раз.");
        else setStatus("");
      }
    }

    mic.addEventListener("click", () => {
      if (recording) stop();
      else start();
    });

    fileInput.addEventListener("change", () => {
      const file = fileInput.files && fileInput.files[0];
      fileInput.value = "";
      if (!file || recording || busy) return;
      transcribeFile(file, file.name || "audio.wav");
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && recording) stop();
    });
  </script>
</body>
</html>
