server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 15m;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Тестовая страница /voice.html шлёт запись сюда. GigaAM слушает порт хоста.
    location /stt/ {
        proxy_pass http://host.docker.internal:9000/;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Штамп файла (ETag) nginx считает сам. Браузер перед показом сверяет его,
    # поэтому после пересборки образа хватает обычного обновления страницы.
    location / {
        etag on;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
