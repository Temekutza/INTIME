services:
  db:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "127.0.0.1:8010:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3010:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend

  litellm-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${LITELLM_DB_USER:?set LITELLM_DB_USER in .env}
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:?set LITELLM_DB_PASSWORD in .env}
      POSTGRES_DB: ${LITELLM_DB_NAME:?set LITELLM_DB_NAME in .env}
    ports:
      - "127.0.0.1:${LITELLM_DB_PORT:-5436}:5432"
    volumes:
      - litellm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Host network: системная Ollama слушает только 127.0.0.1:11435.
  # Из bridge-сети контейнера этот адрес недоступен, а bind Ollama не меняем.
  litellm:
    image: ghcr.io/berriai/litellm:main-v1.83.14-stable.patch.3
    network_mode: host
    environment:
      HOST: 127.0.0.1
      PORT: "4000"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      DATABASE_URL: postgresql://${LITELLM_DB_USER}:${LITELLM_DB_PASSWORD}@127.0.0.1:${LITELLM_DB_PORT:-5436}/${LITELLM_DB_NAME}
      LITELLM_LOG: ERROR
    volumes:
      - ./llm/gateway/config.yaml:/app/config.yaml:ro
    command:
      - "--config=/app/config.yaml"
      - "--host=127.0.0.1"
      - "--port=4000"
    depends_on:
      litellm-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Backend в bridge-сети не видит 127.0.0.1:4000. Слушаем только docker0.
  litellm-docker:
    image: python:3.12-slim
    network_mode: host
    restart: unless-stopped
    depends_on:
      litellm:
        condition: service_healthy
    volumes:
      - ./llm/gateway/docker_bridge.py:/bridge.py:ro
    command: ["python", "-u", "/bridge.py"]

volumes:
  postgres_data:
  litellm_postgres_data: